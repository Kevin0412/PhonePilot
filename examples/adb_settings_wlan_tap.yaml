      success_markers: [WLAN, 蓝牙, 移动网络, 显示和亮度, 搜索设置项]
      target_markers: [设置]
      package: com.android.settings
      foreground_markers: [HWSettings]
      risk: low
    - goal: 进入 WLAN 页面
      success_markers: [可用网络, 可用WLAN, 已连接, 更多WLAN设置, 网络加速]
      target_markers: [WLAN, 无线网络]
      foreground_markers: ["Settings$WifiSettingsActivity"]
      risk: low
  final_success_markers: [可用网络, 可用WLAN, 已连接, 网络加速]
